# Alertmanager for staging and production (task 10-3). Critical alerts go to the worker's
# receiver (apps/worker/src/alertmanager.ts), which texts their name to the on-call numbers
# through Kavenegar, the same way as the worker's own alerts. No notifier outside Iran
# (doc 19 §10-3, rules 17-19). Warnings stay in Grafana.
#
# The token is the worker's ALERTMANAGER_WEBHOOK_TOKEN, mounted as a file from the secrets
# store (10-1), never written here. Not yet checked with amtool (no image offline): run
# `amtool check-config ops/monitoring/alertmanager.yml` from the internal mirror in 10-1.
route:
  receiver: grafana-only
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: on-call-sms
      # The worker keeps a 30-minute cooldown per alert name as well.
      repeat_interval: 30m

receivers:
  # Warnings: seen in Grafana's alert list, nothing sent.
  - name: grafana-only
  - name: on-call-sms
    webhook_configs:
      - url: http://worker:9466/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/worker-webhook-token
        max_alerts: 200

inhibit_rules:
  # A host that is down explains its disk, replica and backup alerts.
  - source_matchers: ['alertname="HostDown"']
    target_matchers: ['severity="warning"']
    equal: [instance]
